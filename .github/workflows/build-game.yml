name: Build game IPA

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: "Direct HTTPS URL to a .nup file or ZIP containing game files"
        required: true
        type: string
      source_format:
        description: "Download format"
        required: true
        type: choice
        options:
          - zip
          - nup
        default: zip
      title_id:
        description: "Optional 16-digit title ID if multiple games are present"
        required: false
        type: string
      package:
        description: "Optional NSP package version, e.g. v327680"
        required: false
        type: string
      romfs:
        description: "How to package game files"
        required: true
        type: choice
        options:
          - bundle
          - separate
        default: bundle

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build unsigned iOS IPA
    runs-on: xcode-27
    timeout-minutes: 360

    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GAME_URL: ${{ inputs.game_url }}
      SOURCE_FORMAT: ${{ inputs.source_format }}
      TITLE_ID: ${{ inputs.title_id }}
      PACKAGE: ${{ inputs.package }}
      ROMFS: ${{ inputs.romfs }}

    steps:
      - name: Check out NXNative
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Apple toolchain
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR" || {
            echo "::error::Xcode 27.2 was not found"
            exit 1
          }
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          test "$(uname -m)" = arm64 || {
            echo "::error::An Apple-silicon runner is required"
            exit 1
          }

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Install dependencies
        run: |
          brew install xcodegen zstd glslang
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            lz4 "capstone>=5,<6" fonttools nsz zbic

      - name: Download game source
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/nxnative-input"
          mkdir -p "$RUNNER_TEMP/nxnative-output"

          case "$GAME_URL" in
            https://*) ;;
            *)
              echo "::error::Only HTTPS download URLs are accepted"
              exit 1
              ;;
          esac

          curl --fail --location --retry 3 \
            --silent --show-error \
            "$GAME_URL" \
            --output "$RUNNER_TEMP/nxnative-input/source"

          if [ "$SOURCE_FORMAT" = zip ]; then
            python3 - \
              "$RUNNER_TEMP/nxnative-input/source" \
              "$RUNNER_TEMP/nxnative-input/game" <<'PY'
          import pathlib
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2]).resolve()
          destination.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = (destination / item.filename).resolve()

                  if target != destination and destination not in target.parents:
                      raise SystemExit(f"Unsafe ZIP path: {item.filename}")

                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(item) as src, target.open("wb") as dst:
                          while True:
                              chunk = src.read(1024 * 1024)
                              if not chunk:
                                  break
                              dst.write(chunk)
          PY

            echo "GAME_DIR=$RUNNER_TEMP/nxnative-input/game" >> "$GITHUB_ENV"
          else
            mv "$RUNNER_TEMP/nxnative-input/source" \
              "$RUNNER_TEMP/nxnative-input/game.nup"

            echo "GAME_DIR=$RUNNER_TEMP/nxnative-input/game.nup" >> "$GITHUB_ENV"
          fi

      - name: Prepare prod.keys
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        if: env.PROD_KEYS != ''
        run: |
          umask 077
          printf '%s\n' "$PROD_KEYS" > "$RUNNER_TEMP/prod.keys"
          echo "PROD_KEYS_PATH=$RUNNER_TEMP/prod.keys" >> "$GITHUB_ENV"

      - name: Build IPA
        run: |
          set -euo pipefail

          args=(
            "$GAME_DIR"
            --platform ios
            --romfs "$ROMFS"
            --work-dir "$RUNNER_TEMP/nxnative-work"
            --out "$RUNNER_TEMP/nxnative-output/game.ipa"
            --no-keep-extracted
            --progress lines
          )

          if [ -n "$TITLE_ID" ]; then
            args+=(--title-id "$TITLE_ID")
          fi

          if [ -n "$PACKAGE" ]; then
            args+=(--package "$PACKAGE")
          fi

          if [ -n "${PROD_KEYS_PATH:-}" ]; then
            args+=(--keys "$PROD_KEYS_PATH")
          fi

          python3 scripts/build_ipa_from_nsp.py "${args[@]}"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-game-ipa
          path: ${{ runner.temp }}/nxnative-output/game.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove temporary key material
        if: always()
        run: rm -f "$RUNNER_TEMP/prod.keys"
